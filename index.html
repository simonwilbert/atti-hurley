<html>
    <style>
        h1 {text-decoration: underline; color: #a00;padding: 30px}
        .site-logo {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 150px;
            height: auto;
        }
        .drawing-area {
            margin: 30px;
            max-width: 420px;
        }
        #drawing-canvas {
            display: block;
            width: 100%;
            height: 220px;
            border: 2px solid #a00;
            border-radius: 6px;
            background: #fff;
            cursor: crosshair;
            touch-action: none;
        }
        #clear-canvas {
            margin-top: 10px;
        }
    </style>
  <body>
    <img class="site-logo" src="logo.png" alt="Attihurley logo">
    <h1>Attihurley</h1>
    <h2>Welcome to Attihurley</h2>
    <p>This is the official website of Attihurley.</p>
    <h1>About Attihurley</h1>
    <p>Drawing expert and creative artist.</p>

    <section class="drawing-area">
      <h2>Have a draw</h2>
      <canvas id="drawing-canvas" aria-label="Freeform drawing canvas"></canvas>
      <button id="clear-canvas" type="button">Clear drawing</button>
    </section>

    <script>
      const canvas = document.getElementById('drawing-canvas');
      const context = canvas.getContext('2d');
      let drawing = false;

      function resizeCanvas() {
        const bounds = canvas.getBoundingClientRect();
        const image = context.getImageData(0, 0, canvas.width, canvas.height);
        canvas.width = bounds.width;
        canvas.height = bounds.height;
        context.lineCap = 'round';
        context.lineJoin = 'round';
        context.lineWidth = 3;
        context.strokeStyle = '#222';
        if (image.width && image.height) context.putImageData(image, 0, 0);
      }

      function pointFromEvent(event) {
        const bounds = canvas.getBoundingClientRect();
        return {
          x: (event.clientX - bounds.left) * (canvas.width / bounds.width),
          y: (event.clientY - bounds.top) * (canvas.height / bounds.height)
        };
      }

      canvas.addEventListener('pointerdown', (event) => {
        drawing = true;
        canvas.setPointerCapture(event.pointerId);
        const point = pointFromEvent(event);
        context.beginPath();
        context.moveTo(point.x, point.y);
      });

      canvas.addEventListener('pointermove', (event) => {
        if (!drawing) return;
        const point = pointFromEvent(event);
        context.lineTo(point.x, point.y);
        context.stroke();
      });

      function stopDrawing() {
        drawing = false;
      }

      canvas.addEventListener('pointerup', stopDrawing);
      canvas.addEventListener('pointercancel', stopDrawing);
      document.getElementById('clear-canvas').addEventListener('click', () => {
        context.clearRect(0, 0, canvas.width, canvas.height);
      });

      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);
    </script>
  </body>
</html>
