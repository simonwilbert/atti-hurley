<html>
    <style>
        h1 {text-decoration: underline; color: #a00;padding: 30px}
        .about-heading {text-align: center;}
        .animated-word {
            animation: colour-shift 2s ease-in-out infinite alternate;
            font-size: 2em;
        }
        .bouncing-mark {
            display: inline-block;
            animation: bounce 0.6s ease-in-out infinite alternate;
            font-size: 2em;
        }
        @keyframes colour-shift {
            from {color: #a00;}
            to {color: #06c;}
        }
        @keyframes bounce {
            from {transform: translateY(0);}
            to {transform: translateY(-12px);}
        }
        .site-logo {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 300px;
            height: auto;
        }
        .drawing-area {
            margin: 30px;
            max-width: 420px;
        }
        .drawing-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            margin: 0 0 10px;
        }
        .tool-button, .colour-button {
            min-height: 34px;
            border: 1px solid #777;
            border-radius: 4px;
            cursor: pointer;
        }
        .tool-button.active, .colour-button.active {
            outline: 3px solid #a00;
            outline-offset: 1px;
        }
        .colour-button {
            width: 34px;
        }
        .colour-picker {
            width: 38px;
            height: 34px;
            padding: 2px;
            cursor: pointer;
        }
        #drawing-canvas {
            display: block;
            width: 100%;
            height: 220px;
            border: 2px solid #a00;
            border-radius: 6px;
            background: #fff;
            cursor: crosshair;
            touch-action: none;
        }
        #clear-canvas {
            margin-top: 10px;
        }
        #drawing-canvas[data-tool="fill"] {
            cursor: cell;
        }
    </style>
  <body>
    <img class="site-logo" src="logo.png" alt="Attihurley logo">
    <h1>Attihurley</h1>
    <h2>Welcome to Attihurley</h2>
    <p>This is the official website of Attihurley.</p>

    <section class="drawing-area">
      <h2>Have a draw</h2>
      <div class="drawing-toolbar" aria-label="Drawing tools">
        <button class="tool-button active" type="button" data-tool="brush" aria-pressed="true">Paintbrush</button>
        <button class="tool-button" type="button" data-tool="fill" aria-pressed="false">Paint pot</button>
        <button class="colour-button active" type="button" data-colour="#222222" aria-label="Black" title="Black" style="background: #222222" aria-pressed="true"></button>
        <button class="colour-button" type="button" data-colour="#cc0000" aria-label="Red" title="Red" style="background: #cc0000" aria-pressed="false"></button>
        <button class="colour-button" type="button" data-colour="#0066cc" aria-label="Blue" title="Blue" style="background: #0066cc" aria-pressed="false"></button>
        <button class="colour-button" type="button" data-colour="#15803d" aria-label="Green" title="Green" style="background: #15803d" aria-pressed="false"></button>
        <input class="colour-picker" id="colour-picker" type="color" value="#222222" aria-label="Choose a custom colour">
      </div>
      <canvas id="drawing-canvas" aria-label="Freeform drawing canvas"></canvas>
      <button id="clear-canvas" type="button">Clear drawing</button>
    </section>

    <h1 class="about-heading">About Attihurley</h1>
    <p>Drawing expert and creative artist. 
        He likes maths and definitely <span class="animated-word">DRAWING</span><span class="bouncing-mark">!</span></p>





    <script>
      const canvas = document.getElementById('drawing-canvas');
      const context = canvas.getContext('2d');
      const colourPicker = document.getElementById('colour-picker');
      const toolButtons = document.querySelectorAll('[data-tool]');
      const colourButtons = document.querySelectorAll('[data-colour]');
      let drawing = false;
      let selectedTool = 'brush';
      let selectedColour = '#222222';

      function resizeCanvas() {
        const bounds = canvas.getBoundingClientRect();
        const image = context.getImageData(0, 0, canvas.width, canvas.height);
        canvas.width = bounds.width;
        canvas.height = bounds.height;
        context.lineCap = 'round';
        context.lineJoin = 'round';
        context.lineWidth = 3;
        context.strokeStyle = selectedColour;
        if (image.width && image.height) context.putImageData(image, 0, 0);
      }

      function pointFromEvent(event) {
        const bounds = canvas.getBoundingClientRect();
        return {
          x: (event.clientX - bounds.left) * (canvas.width / bounds.width),
          y: (event.clientY - bounds.top) * (canvas.height / bounds.height)
        };
      }

      function setTool(tool) {
        selectedTool = tool;
        canvas.dataset.tool = tool;
        toolButtons.forEach((button) => {
          const active = button.dataset.tool === tool;
          button.classList.toggle('active', active);
          button.setAttribute('aria-pressed', active);
        });
      }

      function setColour(colour) {
        selectedColour = colour;
        colourPicker.value = colour;
        context.strokeStyle = colour;
        colourButtons.forEach((button) => {
          const active = button.dataset.colour.toLowerCase() === colour.toLowerCase();
          button.classList.toggle('active', active);
          button.setAttribute('aria-pressed', active);
        });
      }

      function colourToRgba(colour) {
        const value = parseInt(colour.slice(1), 16);
        return [(value >> 16) & 255, (value >> 8) & 255, value & 255, 255];
      }

      function floodFill(x, y) {
        const image = context.getImageData(0, 0, canvas.width, canvas.height);
        const {data, width, height} = image;
        const startX = Math.max(0, Math.min(width - 1, Math.floor(x)));
        const startY = Math.max(0, Math.min(height - 1, Math.floor(y)));
        const startIndex = (startY * width + startX) * 4;
        const target = [data[startIndex], data[startIndex + 1], data[startIndex + 2], data[startIndex + 3]];
        const replacement = colourToRgba(selectedColour);

        if (target.every((channel, index) => channel === replacement[index])) return;

        const matchesTarget = (index) => target.every((channel, offset) => data[index + offset] === channel);
        const fill = (index) => replacement.forEach((channel, offset) => { data[index + offset] = channel; });
        const pixelsToFill = [[startX, startY]];

        while (pixelsToFill.length) {
          const [currentX, currentY] = pixelsToFill.pop();
          if (currentX < 0 || currentX >= width || currentY < 0 || currentY >= height) continue;

          const index = (currentY * width + currentX) * 4;
          if (!matchesTarget(index)) continue;
          fill(index);
          pixelsToFill.push(
            [currentX + 1, currentY],
            [currentX - 1, currentY],
            [currentX, currentY + 1],
            [currentX, currentY - 1]
          );
        }

        context.putImageData(image, 0, 0);
      }

      canvas.addEventListener('pointerdown', (event) => {
        const point = pointFromEvent(event);
        if (selectedTool === 'fill') {
          floodFill(point.x, point.y);
          return;
        }

        drawing = true;
        canvas.setPointerCapture(event.pointerId);
        context.beginPath();
        context.moveTo(point.x, point.y);
        context.arc(point.x, point.y, context.lineWidth / 2, 0, Math.PI * 2);
        context.fillStyle = selectedColour;
        context.fill();
        context.beginPath();
        context.moveTo(point.x, point.y);
      });

      canvas.addEventListener('pointermove', (event) => {
        if (!drawing) return;
        const point = pointFromEvent(event);
        context.lineTo(point.x, point.y);
        context.stroke();
      });

      function stopDrawing() {
        drawing = false;
      }

      canvas.addEventListener('pointerup', stopDrawing);
      canvas.addEventListener('pointercancel', stopDrawing);
      toolButtons.forEach((button) => button.addEventListener('click', () => setTool(button.dataset.tool)));
      colourButtons.forEach((button) => button.addEventListener('click', () => setColour(button.dataset.colour)));
      colourPicker.addEventListener('input', (event) => setColour(event.target.value));
      document.getElementById('clear-canvas').addEventListener('click', () => {
        context.clearRect(0, 0, canvas.width, canvas.height);
      });

      resizeCanvas();
      setTool(selectedTool);
      setColour(selectedColour);
      window.addEventListener('resize', resizeCanvas);
    </script>
  </body>
</html>
